name: Bug report
description: Report a reproducible defect
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this issue. Please provide enough detail to reproduce it.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is broken?
      placeholder: Briefly describe the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Exact steps, including commands and inputs.
      placeholder: |
        1. Run ...
        2. Use config ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: What happened instead?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: Paste relevant output (remove secrets).
      render: shell

  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag or commit SHA
      placeholder: v1.5.0 or a4acd3d
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Go version, MariaDB version, Docker version (if applicable)
      placeholder: |
        OS:
        Go:
        MariaDB:
        Docker:
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed credentials and secrets from logs/config snippets.
          required: true
        - label: I confirmed this issue is not already reported.
          required: true
