name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build Artifacts
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          bin="mariadb-tool"
          if [ "${GOOS}" = "windows" ]; then
            bin="${bin}.exe"
          fi

          out_dir="dist/mariadb-tool_${VERSION}_${GOOS}_${GOARCH}"
          mkdir -p "${out_dir}"

          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o "${out_dir}/${bin}" .

          archive="dist/mariadb-tool_${VERSION}_${GOOS}_${GOARCH}.tar.gz"
          tar -C "dist" -czf "${archive}" "mariadb-tool_${VERSION}_${GOOS}_${GOARCH}"

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mariadb-tool_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish Release
    permissions:
      contents: write
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Verify archives and generate SHA256 checksums
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob
          archives=( *.tar.gz )
          test "${#archives[@]}" -eq 5
          for target in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64 windows_amd64; do
            archive="mariadb-tool_${VERSION}_${target}.tar.gz"
            test -s "$archive"
            tar -tzf "$archive" > /dev/null
          done
          sha256sum "${archives[@]}" > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Publish release assets
        uses: softprops/action-gh-release@62c96d0c4e8a889135c1f3a25910db8dbe0e85f7 # v2.3.4
        with:
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
