name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Unit tests must never opt into real databases, even if integration settings
# are later added elsewhere. Docker integration remains a separate workflow.
env:
  MARIADB_TOOL_INTEGRATION: "0"
  MARIADB_TOOL_LOCAL_INTEGRATION: "0"
  MARIADB_TOOL_LOCAL_DSN: ""

jobs:
  test:
    name: Go checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check gofmt without modifying files
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            printf 'Files requiring gofmt:\n%s\n' "$unformatted" >&2
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./... -count=1 -coverprofile=coverage.out -covermode=atomic

      - name: Verify coverage badge and summarize
        if: runner.os == 'Linux'
        run: |
          bash .github/scripts/coverage-badge.sh coverage.out > "$RUNNER_TEMP/coverage.svg"
          if ! diff -u .github/badges/coverage.svg "$RUNNER_TEMP/coverage.svg"; then
            echo "Coverage changed. Regenerate .github/badges/coverage.svg as documented in MAINTAINING.md." >&2
            exit 1
          fi
          {
            echo '### Linux unit statement coverage'
            echo '```text'
            go tool cover -func=coverage.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Linux coverage report
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-unit-coverage
          path: coverage.out
          if-no-files-found: error
          retention-days: 14

      - name: Build
        run: go build ./...

      - name: Race tests
        if: runner.os == 'Linux'
        env:
          CGO_ENABLED: "1"
        run: |
          gcc --version
          go test -race ./... -count=1

      - name: Check module metadata
        if: runner.os == 'Linux'
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Vulnerability scan
        if: runner.os == 'Linux'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
